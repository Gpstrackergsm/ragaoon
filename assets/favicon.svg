  </defs>

  <!-- Background tile with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#27303f" stroke-width="2"/>

  <!-- Stylized Geometric 'R' with Ergonomic Curve & Speed Slash -->
  <g filter="url(#glow)">
    <!-- Vertical stem -->
    <path d="M18 15 C18 13.9 18.9 13 20 13 L27 13 C28.1 13 29 13.9 29 15 L29 49 C29 50.1 28.1 51 27 51 L20 51 C18.9 51 18 50.1 18 49 Z" fill="url(#ragaoonRedGrad)"/>
    
    <!-- Top Loop -->
    <path d="M27 13 L38 13 C44.6 13 50 18.4 50 25 C50 31.6 44.6 37 38 37 L27 37 Z" fill="none" stroke="url(#ragaoonRedGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Dynamic Kick / Recline Leg -->
    <path d="M33 34 L45 49 C45.8 50.1 47.4 50.4 48.6 49.6 C49.4 49 49.8 48 49.6 47 L40 33 Z" fill="url(#ragaoonRedGrad)"/>

    <!-- Ergonomic Speed Accent Dot -->
